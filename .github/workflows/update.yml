name: Update BB Launcher

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Check for new BB Launcher release
        id: check
        run: |
          CURRENT=$(grep -oP 'version = "\K[^"]+' pkgs/bb-launcher/package.nix)
          LATEST_TAG=$(curl -s https://api.github.com/repos/rainmakerv3/BB_Launcher/releases/latest | grep -oP '"tag_name":\s*"Release\K[^"]+')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT | Latest: $LATEST_TAG"

      - name: Update version and hash
        if: steps.check.outputs.current != steps.check.outputs.latest
        run: |
          sed -i "s/version = \"${{ steps.check.outputs.current }}\"/version = \"${{ steps.check.outputs.latest }}\"/" pkgs/bb-launcher/package.nix

          OLD_HASH=$(grep -oP 'hash = "\K[^"]+' pkgs/bb-launcher/package.nix)
          NEW_HASH=$(nix-build 2>&1 | grep -oP 'got:\s+\Ksha256-[A-Za-z0-9+/=]+' | head -1 || true)

          if [ -z "$NEW_HASH" ]; then
            echo "Computing hash via prefetch..."
            NEW_HASH=$(nix hash path --base64 --type sha256 . 2>/dev/null || true)
            NEW_HASH=$(nix-prefetch-url --unpack "https://github.com/rainmakerv3/BB_Launcher/archive/refs/tags/Release${{ steps.check.outputs.latest }}.tar.gz" 2>&1 | tail -1 || true)
          fi

      - name: Build and get correct hash
        if: steps.check.outputs.current != steps.check.outputs.latest
        run: |
          nix-build -A bb-launcher 2>&1 | tail -20 || true
          nix-build -A bb-launcher 2>&1 | grep -oP '\+sha256-[A-Za-z0-9+/=]+' | head -1 || true

      - name: Commit and push
        if: steps.check.outputs.current != steps.check.outputs.latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkgs/bb-launcher/package.nix
          git commit -m "bb-launcher: ${{ steps.check.outputs.current }} -> ${{ steps.check.outputs.latest }}"
          git push
